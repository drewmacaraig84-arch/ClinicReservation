# CarePoint Clinic — Nginx Load Balancer, Edge CDN Cache & Rate Limiter
proxy_cache_path /var/cache/nginx/carepoint_cdn levels=1:2 keys_zone=CAREPOINT_CDN:20m max_size=1g inactive=60m use_temp_path=off;

# Network-Layer Rate Limiting Zones (DDoS & Brute-Force Protection)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=booking_limit:10m rate=15r/m;

upstream carepoint_backend_cluster {
    least_conn;
    server app-node-1:9000 weight=5 max_fails=3 fail_timeout=15s;
    server app-node-2:9000 weight=5 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

server {
    listen 80;
    server_name clinicreservation.test localhost;
    root /var/www/html/public;
    index index.php;

    # Hardened Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Edge Compression
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # CDN Static Assets Edge Cache (365 Days Immutable)
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-CDN-Edge-Status "HIT-STATIC";
        access_log off;
        try_files $uri =404;
    }

    # Strict Rate Limit on Booking Endpoint
    location = /api/v1/public/book {
        limit_req zone=booking_limit burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # General API Rate Limit
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass carepoint_backend_cluster;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

